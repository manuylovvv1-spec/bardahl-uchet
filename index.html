<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="./manifest.webmanifest">
<title>BARDAHL — учёт заказов</title>
<style>
:root{color-scheme:dark;--yellow:#ffd400;--bg:#111;--panel:#1c1c1c;--line:#414141;--muted:#bdbdbd}*{box-sizing:border-box}body{margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom));max-width:720px;background:var(--bg);color:#f4f4f4;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}h1{font-size:30px;letter-spacing:2px;color:var(--yellow);margin:6px 0 2px}h2{font-size:21px;margin:24px 0 10px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}label{display:block;font-size:13px;color:#ccc;margin:8px 0 4px}input,select,button{font:inherit;width:100%;padding:13px;margin:5px 0;border-radius:9px}input,select{background:#252525;color:white;border:1px solid #555;min-height:47px}button{background:var(--yellow);color:#111;border:0;font-weight:750;min-height:45px;cursor:pointer}button:active{transform:scale(.99)}button.secondary{background:#333;color:#fff;border:1px solid #555}button.danger{background:#4a2424;color:#fff;border:1px solid #774040}button.small{width:auto;min-height:36px;padding:8px 10px;font-size:13px;margin:4px 4px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.total{font-size:22px;font-weight:800;color:var(--yellow);padding:10px 0}.item,.order{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;overflow-wrap:anywhere}.itemrow{display:flex;gap:10px;align-items:center;justify-content:space-between}.itemname{flex:1}.price{white-space:nowrap;font-weight:700}.muted{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{background:#252525;border-radius:10px;padding:10px}.stat strong{display:block;color:var(--yellow);font-size:17px;margin-top:5px}.orderhead{font-weight:750;font-size:17px}.orderdetail{color:#ddd;font-size:14px;line-height:1.5;margin:8px 0}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{color:var(--muted);text-align:center;padding:18px 6px}#custom[hidden]{display:none!important}footer{color:#777;font-size:12px;text-align:center;margin:24px 0 4px}@media(min-width:560px){.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid>div{min-width:0}}
</style>
</head>
<body>
<header><h1>BARDAHL</h1><p class="sub">Учёт работ и заказов автосервиса · суммы в тенге (₸)</p></header>
<section class="panel">
<h2 style="margin-top:0">Новый заказ</h2>
<label for="car">Автомобиль / госномер</label><input id="car" placeholder="Например, Toyota Camry 123ABC" autocomplete="off">
<div class="formgrid"><div><label for="service">Услуга</label><select id="service"></select></div><div><label for="price">Цена, ₸</label><input id="price" type="number" inputmode="decimal" min="1" step="1" placeholder="Цена"></div></div>
<input id="custom" placeholder="Название услуги СТО" hidden>
<button id="add">＋ Добавить услугу</button>
<div id="cart"></div><div class="total" id="cartTotal">Итого: 0 ₸</div>
<button id="save">Сохранить заказ</button>
</section>
<section><h2>Отчёты</h2><div class="panel"><label for="date">Дата отчёта</label><input id="date" type="date"><div id="report" class="stats"></div></div></section>
<section><h2>История заказов</h2><input id="search" placeholder="Поиск по автомобилю или услуге" autocomplete="off"><div class="toolbar"><button id="exportCsv" class="secondary">Экспорт CSV</button><button id="backup" class="secondary">Резервная копия</button></div><button id="restoreBtn" class="secondary">Восстановить из копии</button><input id="restoreFile" type="file" accept="application/json,.json" hidden><div id="orders"></div></section>
<footer>Данные хранятся в этом браузере. Регулярно сохраняйте резервную копию.</footer>
<script>
'use strict';
const services = [["Замена масла в двигателе",1200],["Замена фильтра воздушного",200],["Замена фильтра салонного",200],["Демонтаж защиты",500],["Демонтаж защиты сложной",1000],["Замена тормозной жидкости",2000],["Замена масла в АКПП (со снятием поддона)",4000],["Замена масла в АКПП (без снятия поддона)",3000],["Замена масла в вариаторе",5000],["Замена масла в раздаточной коробке",2000],["Замена масла в редукторе",2000],["Замена охлаждающей жидкости",5500],["Замена жидкости ГУРа",1500],["Замена жидкости ГУРа (с маслом клиента)",3000],["Замена жидкости ГУРа со снятием бачка",2000],["Замена жидкости ГУРа со снятием бачка (с маслом клиента)",4000],["Замена жидкости сцепления",4000],["Замена колодок тормозных (с колодками клиента)",2000],["Замена колодок тормозных внедорожник",3000],["Замена колодок тормозных с электроручником",4500],["Замена масла в DSG",4000],["Замена масла в DSG (с маслом клиента)",5000],["Замена масла в АКПП (без снятия поддона) с маслом клиента",4000],["Замена масла в АКПП (со снятием балки и поддона)",5000],["Замена масла в АКПП (со снятием балки и поддона) с маслом клиента",8000],["Замена масла в АКПП (со снятием поддона) с маслом клиента",6000],["Замена масла в вариаторе (с маслом клиента)",8000],["Замена масла в МКПП",2000],["Замена масла в муфте HALDEX (без снятия крышки)",7500],["Замена масла в муфте HALDEX (со снятием крышки)",12500],["Замена охлаждающей жидкости в двухконтурной системе",7000],["Замена охлаждающей жидкости с химией",10500],["Замена тормозной жидкости (с жидкостью клиента)",3000],["Заправка кондиционера",3000],["Нарезка резьбы",2000]];
const $ = id => document.getElementById(id);
const STORAGE_KEY = 'bardahlOrders';
let cart = [], orders = [], editingId = null;
const money = n => `${Number(n || 0).toLocaleString('ru-RU')} ₸`;
const makeId = () => (Date.now().toString(36) + Math.random().toString(36).slice(2,8));
function loadOrders(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');orders=Array.isArray(data)?data.map(o=>({...o,id:o.id||makeId(),items:Array.isArray(o.items)?o.items:[],total:Number(o.total)||0,car:String(o.car||''),date:String(o.date||'')})):[]}catch(e){orders=[]}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(orders));return true}catch(e){alert('Не удалось сохранить данные. Сделайте резервную копию и освободите место в хранилище браузера.');return false}}
function initServices(){for(const [name,price] of services){const op=document.createElement('option');op.value=name;op.textContent=`${name} — ${money(price)}`;op.dataset.price=price;$('service').append(op)}const op=document.createElement('option');op.value='__custom__';op.textContent='Услуга СТО — вручную';$('service').append(op);$('service').onchange=()=>{const selected=$('service').selectedOptions[0];const manual=selected.value==='__custom__';$('custom').hidden=!manual;$('price').value=selected.dataset.price||''};$('service').onchange()}
function drawCart(){const root=$('cart');root.replaceChildren();if(!cart.length){root.innerHTML='<div class="empty">Добавьте услуги в заказ</div>'}cart.forEach((it,i)=>{const row=document.createElement('div');row.className='item itemrow';const name=document.createElement('div');name.className='itemname';name.textContent=it.name;const price=document.createElement('div');price.className='price';price.textContent=money(it.price);const remove=document.createElement('button');remove.className='small danger';remove.textContent='Убрать';remove.onclick=()=>{cart.splice(i,1);drawCart()};row.append(name,price,remove);root.append(row)});$('cartTotal').textContent='Итого: '+money(cart.reduce((s,i)=>s+Number(i.price),0))}
$('add').onclick=()=>{const selected=$('service').selectedOptions[0];const manual=selected.value==='__custom__';const name=manual?$('custom').value.trim():selected.value;const price=Number($('price').value);if(!name||!Number.isFinite(price)||price<=0){alert('Укажите услугу и цену больше нуля.');return}cart.push({name,price:Math.round(price)});$('custom').value='';drawCart()};
$('save').onclick=()=>{const car=$('car').value.trim();if(!car||!cart.length){alert('Укажите автомобиль и добавьте хотя бы одну услугу.');return}const date=$('date').value||today();const total=cart.reduce((s,i)=>s+Number(i.price),0);if(editingId){const idx=orders.findIndex(o=>o.id===editingId);if(idx>=0)orders[idx]={...orders[idx],car,date,items:[...cart],total};editingId=null;$('save').textContent='Сохранить заказ'}else orders.push({id:makeId(),car,date,items:[...cart],total,createdAt:new Date().toISOString()});if(!persist())return;cart=[];$('car').value='';$('custom').value='';drawCart();drawReport();drawOrders();alert('Заказ сохранён.')};
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
$('date').value=today();$('date').onchange=()=>{drawReport();drawOrders()};
function drawReport(){const date=$('date').value||today(),month=date.slice(0,7),year=date.slice(0,4);const groups=[['День',orders.filter(o=>o.date===date)],['Месяц',orders.filter(o=>o.date.startsWith(month))],['Год',orders.filter(o=>o.date.startsWith(year))]];const root=$('report');root.replaceChildren();groups.forEach(([label,list])=>{const box=document.createElement('div');box.className='stat';const title=document.createElement('span');title.className='muted';title.textContent=label;const count=document.createElement('div');count.textContent=`${list.length} заказ(ов)`;const total=document.createElement('strong');total.textContent=money(list.reduce((s,o)=>s+o.total,0));box.append(title,count,total);root.append(box)})}
function drawOrders(){const root=$('orders');root.replaceChildren();const q=$('search').value.trim().toLowerCase();const filtered=orders.filter(o=>o.date===($('date').value||today())&&(String(o.car).toLowerCase().includes(q)||o.items.some(i=>String(i.name).toLowerCase().includes(q))));if(!filtered.length){root.innerHTML='<div class="empty">Заказы за выбранную дату не найдены</div>';return}filtered.slice().reverse().forEach(o=>{const card=document.createElement('article');card.className='order';const head=document.createElement('div');head.className='orderhead';head.textContent=o.car;const meta=document.createElement('div');meta.className='muted';meta.textContent=`${o.date} · ${o.items.length} услуг(и)`;const detail=document.createElement('div');detail.className='orderdetail';detail.textContent=o.items.map(i=>`${i.name} — ${money(i.price)}`).join(' • ');const total=document.createElement('div');total.className='total';total.style.fontSize='19px';total.textContent='Итого: '+money(o.total);const actions=document.createElement('div');const edit=document.createElement('button');edit.className='small secondary';edit.textContent='Редактировать';edit.onclick=()=>editOrder(o.id);const del=document.createElement('button');del.className='small danger';del.textContent='Удалить';del.onclick=()=>deleteOrder(o.id);actions.append(edit,del);card.append(head,meta,detail,total,actions);root.append(card)})}
function editOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;editingId=id;$('car').value=o.car;$('date').value=o.date;cart=o.items.map(i=>({...i}));drawCart();$('save').textContent='Сохранить изменения';window.scrollTo({top:0,behavior:'smooth'})}
function deleteOrder(id){const o=orders.find(x=>x.id===id);if(!o||!confirm(`Удалить заказ «${o.car}» на ${money(o.total)}?`))return;orders=orders.filter(x=>x.id!==id);if(!persist())return;drawReport();drawOrders()}
$('search').oninput=drawOrders;
function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('backup').onclick=()=>download(`bardahl-backup-${today()}.json`,JSON.stringify({app:'BARDAHL',version:2,exportedAt:new Date().toISOString(),orders},null,2),'application/json;charset=utf-8');
$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const imported=Array.isArray(data)?data:data.orders;if(!Array.isArray(imported))throw Error('bad');if(!confirm(`Импортировать ${imported.length} заказов? Текущие заказы будут объединены с копией.`))return;const normalized=imported.filter(o=>o&&typeof o==='object'&&o.car&&Array.isArray(o.items)).map(o=>({...o,id:o.id||makeId(),total:Number(o.total)||o.items.reduce((s,i)=>s+(Number(i.price)||0),0),date:String(o.date||today())}));const ids=new Set(orders.map(o=>o.id));orders.push(...normalized.filter(o=>!ids.has(o.id)));if(persist()){drawReport();drawOrders();alert('Резервная копия восстановлена.')} }catch(err){alert('Не удалось прочитать файл. Выберите резервную копию BARDAHL в формате JSON.')}finally{e.target.value=''}};
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}$('exportCsv').onclick=()=>{const rows=[['Дата','Автомобиль / госномер','Услуги','Сумма, KZT'],...orders.map(o=>[o.date,o.car,o.items.map(i=>`${i.name} (${i.price})`).join('; '),o.total])];const csv='﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');download(`bardahl-orders-${today()}.csv`,csv,'text/csv;charset=utf-8')};
loadOrders();initServices();drawCart();drawReport();drawOrders();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Офлайн-режим недоступен:', err)));
}
</script>
</body></html>
